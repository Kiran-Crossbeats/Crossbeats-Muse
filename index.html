<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossbeats MUSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#06060b; --ink:#f6f6fa; --muted:#a6a6bb; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --orange:#4f8fa5; --amber:#a8c8cf; --pink:#8196c5; --violet:#6578a8; --cyan:#65b9c5; --mint:#83c6b0;
  --a:#4f8fa5; --b:#a8c8cf; --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body:not(.ready){overflow:hidden}
img{display:block;max-width:100%}
h1,h2,h3{font-family:'Sora',sans-serif;letter-spacing:-.025em;line-height:1.06}
::selection{background:var(--orange);color:#fff}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:linear-gradient(var(--orange),var(--violet));border-radius:8px}

/* loader */
.loader{position:fixed;inset:0;z-index:200;background:#07090d;display:grid;place-items:center;transition:opacity .65s var(--ease),visibility .65s,filter .65s;will-change:opacity}
.loader.off{opacity:0;visibility:hidden;filter:blur(8px);pointer-events:none}
.loader .mk{width:68px;height:68px;border-radius:21px;display:grid;place-items:center;font-size:25px;color:#fff;background:linear-gradient(145deg,#ff6a00,#d9b77a 58%,#65b9c5);animation:spin 3.2s linear infinite;box-shadow:0 0 54px rgba(255,106,0,.22)}
.loader .mk i{animation:spin 3.2s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}

/* ambient */
.field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.field i{position:absolute;border-radius:50%;filter:blur(140px);opacity:.17;animation:drift 32s ease-in-out infinite}
.field i:nth-child(1){width:640px;height:640px;background:var(--orange);top:-200px;left:-180px}
.field i:nth-child(2){width:540px;height:540px;background:var(--violet);top:30%;right:-200px;animation-delay:-8s}
.field i:nth-child(3){width:540px;height:540px;background:var(--pink);bottom:-220px;left:20%;animation-delay:-14s;opacity:.12}
.field i:nth-child(4){width:440px;height:440px;background:var(--cyan);top:55%;left:-160px;animation-delay:-4s;opacity:.09}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-50px) scale(1.12)}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%)}
.grain{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.spot{position:fixed;left:0;top:0;width:640px;height:640px;margin:-320px 0 0 -320px;border-radius:50%;z-index:1;pointer-events:none;background:radial-gradient(circle,rgba(255,106,0,.08),rgba(101,185,197,.045) 45%,transparent 70%);will-change:transform}
@media(hover:none),(max-width:900px){.spot{display:none}}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;height:68px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;background:rgba(6,6,11,.55);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border-bottom:1px solid var(--line);transition:transform .6s var(--ease)}
.nav.hide{transform:translateY(-100%)}
.logo{display:flex;align-items:center;gap:13px;font-family:'Sora';font-weight:700;letter-spacing:.16em;font-size:14px}
.logo b{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:14px;background:linear-gradient(145deg,var(--orange),var(--amber) 62%,#6c9ca5);box-shadow:0 0 24px rgba(255,106,0,.22)}
.logo em{font-style:normal;margin-left:7px;background:linear-gradient(90deg,var(--orange),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.to-top{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:#fff;cursor:pointer;transition:.4s var(--ease)}
.to-top:hover{background:linear-gradient(135deg,var(--orange),var(--amber));border-color:transparent;transform:translateY(-3px);box-shadow:0 12px 26px rgba(255,106,0,.22)}
.bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,var(--orange),var(--amber),var(--cyan));box-shadow:0 0 12px rgba(255,106,0,.28)}
.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.dots a{position:relative;width:8px;height:8px;border-radius:8px;background:rgba(255,255,255,.2);transition:.5s var(--ease)}
.dots a.on{height:28px;background:linear-gradient(var(--orange),var(--amber));box-shadow:0 0 12px rgba(255,106,0,.32)}
.dots a:hover{background:#fff}
.dots a::after{content:attr(data-t);position:absolute;right:20px;top:50%;transform:translate(8px,-50%);white-space:nowrap;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(12,12,20,.85);border:1px solid var(--line2);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:.3s}
.dots a:hover::after{opacity:1;transform:translate(0,-50%)}
@media(max-width:900px){.dots{display:none}.nav{padding:0 18px}}

/* hero */
.hero{position:relative;z-index:2;min-height:100vh;padding:100px 36px 44px;display:flex;align-items:center}
.hero-grid{display:grid;grid-template-columns:108px 1fr;gap:30px;width:100%;max-width:1500px;margin:0 auto;align-items:center}
.tiles{display:flex;flex-direction:column;gap:16px;max-height:min(74vh,660px);overflow-y:auto;padding:10px 12px 10px 8px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{--a:var(--orange);position:relative;flex:none;width:86px;height:86px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,#151522,#0b0b13);cursor:pointer;opacity:.55;transition:transform .6s var(--ease),border-color .4s,box-shadow .5s,opacity .4s}
.tile img{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:contain}
.tile:hover{opacity:1;transform:translateX(5px)}
.tile.on{opacity:1;transform:translateX(10px) scale(1.07);border-color:transparent;box-shadow:0 18px 40px color-mix(in srgb,var(--a) 42%,transparent)}
.tile.on::after{content:"";position:absolute;inset:-4px;border-radius:26px;padding:2.5px;background:conic-gradient(var(--a) calc(var(--pr,0)*1%),rgba(255,255,255,.1) 0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.stage-wrap{position:relative;opacity:0;transform:translateY(40px) scale(.97);transition:opacity 1.3s var(--ease) .2s,transform 1.3s var(--ease) .2s}
.ready .stage-wrap{opacity:1;transform:none}
.stage{--ac:var(--orange);position:relative;height:min(74vh,660px);min-height:380px;perspective:1800px;overflow:hidden;border-radius:38px;border:1px solid var(--line2);background:radial-gradient(ellipse at 50% 58%,color-mix(in srgb,var(--ac) 17%,transparent),transparent 62%),radial-gradient(ellipse at 15% 0%,rgba(100,117,168,.13),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(101,185,197,.09),transparent 50%),#090b10;box-shadow:0 50px 120px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);touch-action:pan-y;user-select:none;transition:background 1.2s var(--ease)}
.stage::after{content:"";position:absolute;left:50%;bottom:7%;width:56%;height:46px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--ac) 55%,transparent),transparent 70%);filter:blur(16px);opacity:.7;pointer-events:none;z-index:1;transition:background .9s}
.sl{--a:var(--orange);position:absolute;left:50%;top:50%;width:62%;height:84%;transition:transform 1.2s var(--ease),opacity 1s ease,filter 1s;will-change:transform,opacity;backface-visibility:hidden}
.sl .card{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--a) 23%,transparent),transparent 64%),linear-gradient(160deg,#191b23,#0a0b10);border:1px solid color-mix(in srgb,var(--a) 28%,transparent);box-shadow:0 36px 78px rgba(0,0,0,.58),0 0 46px color-mix(in srgb,var(--a) 12%,transparent)}
.sl .card::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.12),transparent 32%)}
.sl img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55));pointer-events:none}
.ctrls{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;display:flex;gap:10px;padding:8px;border-radius:999px;background:rgba(10,10,18,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2)}
.ctrls button{width:46px;height:46px;border-radius:50%;border:0;color:#fff;background:rgba(255,255,255,.07);cursor:pointer;transition:background .35s var(--ease),transform .35s var(--ease),box-shadow .35s var(--ease)}
button:focus-visible,.tile:focus-visible,.dots a:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.ctrls button:hover{background:linear-gradient(135deg,var(--orange),var(--amber));transform:scale(1.08);box-shadow:0 10px 24px rgba(255,106,0,.24)}
@media(max-width:900px){
  .hero{padding:88px 16px 30px}
  .hero-grid{grid-template-columns:1fr;gap:14px}
  .tiles{flex-direction:row;order:2;max-height:none;overflow-x:auto;overflow-y:hidden;padding:14px 8px}
  .tile{width:68px;height:68px;border-radius:18px}.tile.on{transform:translateY(-6px) scale(1.07)}.tile:hover{transform:none}
  .stage{height:58vh;border-radius:28px}.sl{width:80%}
}

/* sections */
main{position:relative;z-index:2}
.sec{--a:var(--orange);--b:var(--amber);padding:130px 36px 10px}
.wrap{max-width:1320px;margin:0 auto}
.head{position:relative;display:grid;grid-template-columns:auto 1fr 1fr;gap:34px;align-items:end;margin-bottom:44px;padding-top:34px}
.head::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--a),color-mix(in srgb,var(--b) 40%,transparent) 40%,transparent)}
.num{font-family:'Sora';font-weight:800;font-size:clamp(70px,9.5vw,138px);line-height:.82;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--a) 75%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--a) 70%,transparent),transparent 82%);-webkit-background-clip:text;background-clip:text}
.ttl{display:flex;flex-direction:column;gap:18px}
.kick{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:7px 15px 7px 8px;border-radius:999px;font-size:13px;font-weight:600;color:#fff;background:color-mix(in srgb,var(--a) 13%,transparent);border:1px solid color-mix(in srgb,var(--a) 42%,transparent);backdrop-filter:blur(8px)}
.kick i{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--a) 60%,transparent)}
.ttl h2{font-size:clamp(30px,3.9vw,54px);font-weight:700;background:linear-gradient(180deg,#fff 50%,color-mix(in srgb,var(--b) 65%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:17px;line-height:1.7;padding-bottom:6px;max-width:470px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:9px;padding:10px 17px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid color-mix(in srgb,var(--a) 45%,transparent);background:color-mix(in srgb,var(--a) 10%,transparent);transition:.45s var(--ease)}
.chip i{color:var(--b);transition:.3s}
.chip:hover{transform:translateY(-4px);background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;box-shadow:0 14px 30px color-mix(in srgb,var(--a) 40%,transparent)}.chip:hover i{color:#fff}
@media(max-width:900px){.sec{padding:84px 18px 0}.head{grid-template-columns:1fr;gap:14px}.num{font-size:76px}}

/* image frame — full image, never cropped */
.frame{position:relative;padding:1.5px;border-radius:32px;background:linear-gradient(135deg,var(--a),rgba(255,255,255,.06) 35%,rgba(255,255,255,.06) 65%,var(--b));scale:var(--fs,1);transition:transform .6s var(--ease)}
.frame::before{content:"";position:absolute;inset:8% 5%;z-index:-1;border-radius:44px;background:linear-gradient(135deg,var(--a),var(--b));filter:blur(80px);opacity:.26;transition:opacity .7s}
.frame:hover::before{opacity:.5}
.frame .in{position:relative;border-radius:31px;overflow:hidden;background:#0a0a12;--mx:50%;--my:50%}
.frame img{width:100%;height:auto;opacity:0;transition:transform 1.4s var(--ease),opacity .7s var(--ease);will-change:transform,opacity}
.frame img.loaded{opacity:1}
.frame img:not([src]),.frame img.broken{opacity:0}
.frame:hover img{transform:scale(1.02)}
.frame .in::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(520px circle at var(--mx) var(--my),rgba(255,255,255,.12),transparent 45%)}
.frame:hover .in::after{opacity:1}

/* reveal */
.rv{opacity:0;transform:translateY(38px);filter:blur(3px);transition:opacity .95s var(--ease),transform .95s var(--ease),filter .95s var(--ease)}
.rv.in{opacity:1;transform:none;filter:none}
.frame.rv{transform:translateY(48px) scale(.975)}
.frame.rv.in{transform:none}
.rv.d1{transition-delay:.14s}

/* exploded view */
.exp{position:relative;height:420vh;margin-top:100px}
.exp-sticky{position:sticky;top:0;height:100vh;padding:88px 36px 28px;display:flex;flex-direction:column}
.exp-sticky .head{max-width:1320px;width:100%;margin:0 auto 12px;padding-top:20px}
.exp-sticky .num{font-size:clamp(56px,7vw,100px)}
.exp-stage{--violet:#7c4dff;--cyan:#19d3ff;--orange:#ff6a00;position:relative;flex:1;min-height:0;max-width:1320px;width:100%;margin:0 auto;border-radius:36px;border:1px solid var(--line2);overflow:hidden;box-shadow:0 50px 120px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);background:radial-gradient(ellipse at 50% 60%,color-mix(in srgb,var(--violet) calc(32% * var(--p,0) + 8%),transparent),transparent 62%),radial-gradient(ellipse at 50% 125%,color-mix(in srgb,var(--orange) calc(38% * var(--p,0)),transparent),transparent 60%),#08080f}
.exp-stage::before{content:"";position:absolute;left:50%;top:50%;width:min(62vh,72%);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(calc(.7 + var(--p,0)*.9));border:1px solid color-mix(in srgb,var(--cyan) 42%,transparent);box-shadow:0 0 100px color-mix(in srgb,var(--orange) 32%,transparent) inset;opacity:calc(.25 + var(--p,0)*.5)}
.fr{position:absolute;inset:2% 4%;width:92%;height:96%;object-fit:contain;opacity:0;will-change:opacity,transform;filter:drop-shadow(0 30px 50px rgba(0,0,0,.6))}
.rail{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;width:min(340px,70%)}
.rail i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.rail i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--pink),var(--violet))}
@media(max-width:900px){.exp{height:360vh}.exp-sticky{padding:78px 14px 20px}.exp-sticky .sub{display:none}}

footer{position:relative;z-index:2;margin-top:140px;padding:38px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line);background:rgba(6,6,11,.75)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}.rv{opacity:1;transform:none;filter:none}}

/* Premium refinement: cooler mineral palette, clearer above-the-fold feature layout.
   Product imagery retains its original signature orange; UI lighting stays restrained. */
:root{--ui-blue:#527f9d;--ui-teal:#63a9b2;--ui-lilac:#8b96c6;--ui-silver:#b8c9d2}
::selection{background:var(--ui-blue);color:#fff}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--ui-blue),var(--ui-teal))}
.field i:nth-child(1){background:#527f9d;opacity:.13}
.field i:nth-child(2){background:#526da4;opacity:.16}
.field i:nth-child(3){background:#668f9a;opacity:.09}
.spot{background:radial-gradient(circle,rgba(82,127,157,.09),rgba(101,185,197,.055) 45%,transparent 70%)}
.logo b{background:linear-gradient(145deg,#527f9d,#65b9c5 62%,#b8c9d2);box-shadow:0 0 24px rgba(82,127,157,.2)}
.logo em{background:linear-gradient(90deg,#8fb8c4,#b8c9d2);-webkit-background-clip:text;background-clip:text;color:transparent}
.to-top:hover{background:linear-gradient(135deg,#527f9d,#65b9c5);box-shadow:0 12px 26px rgba(82,127,157,.2)}
.bar{background:linear-gradient(90deg,#527f9d,#65b9c5,#a8c8cf);box-shadow:0 0 12px rgba(82,127,157,.22)}
.dots a.on{background:linear-gradient(#527f9d,#65b9c5);box-shadow:0 0 12px rgba(82,127,157,.28)}
.tile.on{box-shadow:0 18px 40px color-mix(in srgb,#527f9d 34%,transparent)}
.stage{background:radial-gradient(ellipse at 50% 58%,color-mix(in srgb,var(--ac) 11%,transparent),transparent 62%),radial-gradient(ellipse at 15% 0%,rgba(100,117,168,.16),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(101,185,197,.12),transparent 50%),#090b10}
.sec{padding-top:94px;padding-bottom:26px}
.head{margin-bottom:28px;gap:30px;padding-top:28px}
.num{-webkit-text-stroke-color:color-mix(in srgb,var(--a) 62%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--a) 52%,transparent),transparent 82%);-webkit-background-clip:text;background-clip:text}
.kick{background:color-mix(in srgb,var(--a) 10%,transparent);border-color:color-mix(in srgb,var(--a) 32%,transparent)}
.kick i{background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 18px color-mix(in srgb,var(--a) 28%,transparent)}
.ttl h2{background:linear-gradient(180deg,#fff 42%,color-mix(in srgb,var(--b) 45%,#fff));-webkit-background-clip:text;background-clip:text}
.chip{border-color:color-mix(in srgb,var(--a) 28%,transparent);background:color-mix(in srgb,var(--a) 7%,transparent)}
.chip:hover{background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 14px 30px color-mix(in srgb,var(--a) 24%,transparent)}
.frame{max-width:1320px;margin-inline:auto;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 72%,#fff 0%),rgba(255,255,255,.07) 35%,rgba(255,255,255,.05) 65%,color-mix(in srgb,var(--b) 65%,#fff 0%))}
.frame::before{background:linear-gradient(135deg,var(--ui-blue),var(--ui-teal));opacity:.16;filter:blur(72px)}
.frame .in{height:clamp(300px,51vh,540px);display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,rgba(82,127,157,.075),transparent 68%),#080b11}
.frame img{width:100%;height:100%;object-fit:contain;padding:8px;transition:transform 1.1s var(--ease),opacity .65s var(--ease),filter .8s var(--ease)}
.frame:hover img{transform:scale(1.012);filter:drop-shadow(0 24px 34px rgba(0,0,0,.26))}
.rv{transition:opacity .8s var(--ease),transform .8s var(--ease),filter .8s var(--ease)}
.frame.rv{transform:translateY(30px) scale(.985)}
.frame.rv.in{transform:none}
.exp-sticky .head{margin-bottom:12px}
@media(min-width:901px){.sec .wrap{max-width:1320px}.sec .head{grid-template-columns:minmax(72px,.55fr) minmax(330px,1fr) minmax(280px,.9fr)}.sec .ttl h2{max-width:560px}.sec .sub{font-size:16px;line-height:1.65}}
@media(max-width:900px){.sec{padding-top:82px;padding-bottom:20px}.frame .in{height:clamp(260px,45vh,440px)}.head{margin-bottom:22px}}
@media(max-height:780px) and (min-width:901px){.sec{padding-top:82px}.frame .in{height:clamp(270px,48vh,440px)}.head{margin-bottom:22px}.ttl h2{font-size:clamp(28px,3.3vw,46px)}}


/* Final refinement: fit feature copy and image comfortably in one desktop viewport. */
:root{
  --bg:#070b12; --ink:#f4f7fb; --muted:#aab7c7;
  --line:rgba(194,215,231,.09); --line2:rgba(194,215,231,.17);

const DUR=4600, slides=[], tiles=[];
heroImgs.forEach((src,i)=>{
  const c=PAL[i%PAL.length][0];
  const s=document.createElement('div'); s.className='sl'; s.style.setProperty('--a',c);
  s.innerHTML=`<div class="card"><img src="${src}" alt="Muse ${i+1}" draggable="false" loading="eager" decoding="async"></div>`;
  const heroImage=s.querySelector('img'); heroImage.addEventListener('error',()=>{heroImage.style.display='none';s.querySelector('.card').style.background='radial-gradient(circle at 50% 42%,rgba(255,106,0,.12),transparent 64%),linear-gradient(160deg,#191b23,#0a0b10)'},{once:true});
  s.addEventListener('click',()=>{if(i!==cur)go(i)});
  stage.appendChild(s); slides.push(s);
  const t=document.createElement('div'); t.className='tile'; t.style.setProperty('--a',c);
  t.innerHTML=`<img src="${src}" alt="" draggable="false">`;
  t.onclick=()=>go(i); tilesEl.appendChild(t); tiles.push(t);
});
function layout(){
  const mob=innerWidth<900;
  slides.forEach((s,i)=>{
    let d=i-cur; if(d>n/2)d-=n; if(d<-n/2)d+=n;
    const a=Math.abs(d);
    s.style.transform=`translate(-50%,-50%) translateX(${d*(mob?62:60)}%) translateZ(${-a*170}px) rotateY(${-d*20}deg) scale(${1-a*.1})`;
    s.style.opacity=a>2?0:(a===0?1:.75-a*.22);
    s.style.filter=a===0?'none':`brightness(${.62-a*.1}) saturate(.9)`;
    s.style.zIndex=10-a; s.style.pointerEvents=a>2?'none':'auto';
    s.style.cursor=a===0?'default':'pointer';
  });
  tiles.forEach((t,i)=>{t.classList.toggle('on',i===cur);if(i!==cur)t.style.removeProperty('--pr')});
  stage.style.setProperty('--ac',PAL[cur%PAL.length][0]);
  const t=tiles[cur];
  if(mob) tilesEl.scrollTo({left:t.offsetLeft-tilesEl.clientWidth/2+t.offsetWidth/2,behavior:'smooth'});
  else tilesEl.scrollTo({top:t.offsetTop-tilesEl.clientHeight/2+t.offsetHeight/2,behavior:'smooth'});
}
function go(i){cur=(i+n)%n;t0=performance.now();layout()}
$('#next').onclick=()=>go(cur+1);
$('#prev').onclick=()=>go(cur-1);
$('#play').onclick=()=>{playing=!playing;$('#pi').className=playing?'fa-solid fa-pause':'fa-solid fa-play';t0=performance.now()};
let sx=null;
stage.addEventListener('pointerdown',e=>sx=e.clientX);
addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1))});
new IntersectionObserver(es=>{visible=es[0].isIntersecting;t0=performance.now()},{threshold:.25}).observe(stage);
addEventListener('resize',layout);

/* ============ EXPLODED VIEW — scroll-scrubbed frames ============ */
const exp=$('#exp'), fr=[...exp.querySelectorAll('.fr')], rails=[...exp.querySelectorAll('.rail b')], expStage=$('#expStage');
let tgt=0,pos=0;
function expScroll(){const r=exp.getBoundingClientRect();tgt=Math.min(1,Math.max(0,-r.top/(r.height-innerHeight)))*4}

/* ============ MAIN LOOP ============ */
function tick(now){
  if(playing&&visible){
    const p=Math.min((now-t0)/DUR,1);
    tiles[cur].style.setProperty('--pr',p*100);
    if(p>=1)go(cur+1);
  }
  if(!reduceMotion){sx2+=(mx-sx2)*.08;sy2+=(my-sy2)*.08;spot.style.transform=`translate3d(${sx2}px,${sy2}px,0)`;}
  pos+=(tgt-pos)*.09; if(Math.abs(tgt-pos)<.001)pos=tgt;
  fr.forEach((f,i)=>{
    const d=Math.abs(pos-i),o=Math.min(1,Math.max(0,1.6*(1-d)));
    f.style.opacity=o;
    f.style.transform=`scale(${1+(pos-i)*.025}) translateY(${(i-pos)*6}px)`;
  });
  rails.forEach((b,i)=>b.style.width=Math.min(1,Math.max(0,pos-i))*100+'%');
  expStage.style.setProperty('--p',(pos/4).toFixed(3));
  requestAnimationFrame(tick);
}
layout();onScroll();requestAnimationFrame(tick);

/* ============ LOAD SEQUENCE ============ */
let done=false;
function ready(){
  if(done)return; done=true;
  document.body.classList.add('ready');
  requestAnimationFrame(()=>setTimeout(()=>$('#loader').classList.add('off'),180));
  t0=performance.now();
}
// Start the PDP as soon as the hero carousel is ready, not when every external asset finishes.
const heroReady=Promise.all([...document.querySelectorAll('#stage img')].map(img=>{
  if(img.complete) return Promise.resolve();
  return new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});});
}));
Promise.race([heroReady,new Promise(resolve=>setTimeout(resolve,1100))]).then(()=>setTimeout(ready,120));
addEventListener('load',()=>setTimeout(ready,80),{once:true});
setTimeout(ready,1800);
</script>
</body>
</html>
